    function LucideIcon({ name, className = "w-5 h-5" }) {
      const iconRef = useRef(null);
      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
          window.lucide.createIcons({ root: iconRef.current });
        }
      }, [name, className]);
      return <span ref={iconRef} className="inline-flex items-center justify-center" />;
    }

                    <div className="space-y-1 pt-2">

                    </div>
                  </div>
                </div>
              </div>
            ))}

          <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-indigo-100 p-6 rounded-3xl space-y-3">
            <h3 className="font-bold text-indigo-900 flex items-center space-x-2">
              <span>💡 口语表达小贴士 (Cultural & Oral Tip)</span>
            </h3>
            <p className="text-xs sm:text-sm text-slate-700 leading-relaxed">
              在口语表达中，常用句型 <strong>“A: 你知道中国的……吗？ B: 当然了。据说（jùshuō），……。”</strong> 来向他人推荐或介绍中国城市。例如：
              <span className="block mt-1 font-medium text-indigo-800">
                “家人们！据说‘桂林山水甲天下’，你一定要去桂林看看！”
              </span>
            </p>
          </div>
        </div>
      );
    }

          <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">

            <div className="grid grid-cols-1 md:grid-cols-3 gap-5">

                  <div className="space-y-1.5 border-t border-slate-200 pt-3">
                    <div className="text-xs font-bold text-emerald-700 flex items-center space-x-1">
                      <CheckCircle2 className="w-3.5 h-3.5" />
                      <span>推荐：{item.recommendation || item.suitable}</span>

                    <div className="text-xs text-slate-500">
                      {item.reason || item.quote}

              ))}
            </div>

            <div className="bg-amber-50/60 border border-amber-200 p-5 rounded-2xl space-y-2">
              <h4 className="font-bold text-amber-900 text-sm flex items-center space-x-2">

              <p className="text-xs sm:text-sm text-slate-700 leading-relaxed">
                试着与同桌分角色练习对话：一名学生扮演旅行顾问 (Tour Guide)，其他学生扮演不同需求的顾客 (Customer A, B, C)，尝试运用句型 
                <span className="font-bold text-indigo-700"> “想……就……” </span> 或 <span className="font-bold text-indigo-700"> “……就……吧” </span> 进行推荐！
              </p>

          </div>
        </div>

    function TextsTab() {
      const [selectedText, setSelectedText] = useState(COURSE_TEXTS[0]);

      const [showEnglish, setShowEnglish] = useState(true);

      return (
        <div className="space-y-6 animate-fade-in">
          <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col sm:flex-row justify-between items-center gap-4">
            <div className="flex items-center space-x-2 overflow-x-auto w-full sm:w-auto no-scrollbar">
              {COURSE_TEXTS.map((t) => (
                <button
                  key={t.id}
                  onClick={() => setSelectedText(t)}
                  className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-bold whitespace-nowrap transition ${
                    selectedText.id === t.id
                      ? 'bg-indigo-600 text-white shadow'
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  课文 {t.id}
                </button>
              ))}
            </div>

            <div className="flex items-center space-x-3 text-xs font-medium text-slate-600">
              <button
                onClick={() => setShowPinyin(!showPinyin)}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border transition ${
                  showPinyin ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-slate-50 border-slate-200'
                }`}
              >
                {showPinyin ? <Eye className="w-3.5 h-3.5" /> : <EyeOff className="w-3.5 h-3.5" />}

              </button>
              <button
                onClick={() => setShowEnglish(!showEnglish)}
                className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg border transition ${
                  showEnglish ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-slate-50 border-slate-200'
                }`}
              >
                {showEnglish ? <Eye className="w-3.5 h-3.5" /> : <EyeOff className="w-3.5 h-3.5" />}
                <span>英文翻译 (English)</span>
              </button>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
            <div>
              {showPinyin && (
                <p className="text-xs sm:text-sm text-indigo-600 font-medium mb-0.5">
                  {selectedText.pinyinTitle}
                </p>
              )}
              <h2 className="text-xl sm:text-2xl font-bold text-slate-800">{selectedText.title}</h2>
              <p className="text-xs text-slate-400 mt-1">对话人物：{selectedText.speaker}</p>
            </div>

            <div className="space-y-4">
              {selectedText.content.map((line, idx) => (
                <div key={idx} className="flex items-start space-x-3 group">

                    {line.speaker}
                  </div>
                  <div className="flex-1 bg-slate-50 p-4 rounded-2xl border border-slate-100 group-hover:border-indigo-200 group-hover:bg-indigo-50/20 transition space-y-1">
                    {showPinyin && (
                      <div className="text-xs text-indigo-600 font-medium">{line.py}</div>
                    )}
                    <div className="text-base font-bold text-slate-800">{line.ch}</div>
                    {showEnglish && (
                      <div className="text-xs text-slate-500 pt-0.5">{line.en}</div>

                </div>

    function WorkshopTab() {
      const [clozeValues, setClozeValues] = useState({
        v1: '', v2: '', v3: '', v4: '', v5: '', v6: '', v7: ''
      });
      const [clozeScore, setClozeScore] = useState(null);

      const [essay, setEssay] = useState({
        destination: '杭州西湖',
        transport: '乘坐高铁',
        seat: '靠窗的位子',
        accommodation: '特色民居',
        activities: '自助游，想吃什么就吃什么，想玩多久就玩多久',
        expectation: '留下美好的回忆'
      });

      const handleClozeCheck = () => {
        const answers = {
          v1: '开心',
          v2: '好奇',
          v3: '热情',
          v4: '期待',
          v5: '笑',
          v6: '紧张',
          v7: '高兴'
        };
        let correct = 0;
        Object.keys(answers).forEach(k => {
          if (clozeValues[k].trim() === answers[k]) correct++;
        });
        setClozeScore(correct);
      };

      return (
        <div className="space-y-8 animate-fade-in">
          <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
            <div>
              <span className="px-3 py-1 bg-purple-100 text-purple-800 rounded-full text-xs font-bold">
                语法与叙事进阶
              </span>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mt-2">
                练习一：从对话到故事改写 (Dialogue to Narrative)
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 mt-1">
                学会使用逻辑连接词（有的……有的……，不但……而且……，……以后）和情绪副词填空。
              </p>
            </div>

            <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 leading-loose text-sm sm:text-base text-slate-800 space-y-4">
              <p>
                学校马上就要放暑假了，大家都很【
                <input
                  type="text"
                  value={clozeValues.v1}
                  onChange={(e) => setClozeValues({ ...clozeValues, v1: e.target.value })}
                  className="w-20 px-2 py-0.5 border border-indigo-300 rounded text-center text-indigo-700 font-bold focus:outline-none"
                  placeholder="提示:开心"
                />
                】。王朋的同学有的想去暑期班学习，有的回家打工，还有的去公司实习。王朋告诉李友他要回北京看父母。李友对北京很有兴趣，她【
                <input
                  type="text"
                  value={clozeValues.v2}
                  onChange={(e) => setClozeValues({ ...clozeValues, v2: e.target.value })}
                  className="w-20 px-2 py-0.5 border border-indigo-300 rounded text-center text-indigo-700 font-bold focus:outline-none"
                  placeholder="提示:好奇"
                />
                】地问：“北京好玩吗？”王朋【
                <input
                  type="text"
                  value={clozeValues.v3}
                  onChange={(e) => setClozeValues({ ...clozeValues, v3: e.target.value })}
                  className="w-20 px-2 py-0.5 border border-indigo-300 rounded text-center text-indigo-700 font-bold focus:outline-none"
                  placeholder="提示:热情"
                />
                】地介绍说，北京是中国的首都，也是政治和文化中心。北京不但有很多名胜古迹，而且好吃的饭馆多得不得了。听了王朋的介绍以后，李友【
                <input
                  type="text"
                  value={clozeValues.v4}
                  onChange={(e) => setClozeValues({ ...clozeValues, v4: e.target.value })}
                  className="w-20 px-2 py-0.5 border border-indigo-300 rounded text-center text-indigo-700 font-bold focus:outline-none"
                  placeholder="提示:期待"
                />
                】地说：“太好了！要是能去北京就好了。”王朋【
                <input
                  type="text"
                  value={clozeValues.v5}
                  onChange={(e) => setClozeValues({ ...clozeValues, v5: e.target.value })}
                  className="w-20 px-2 py-0.5 border border-indigo-300 rounded text-center text-indigo-700 font-bold focus:outline-none"
                  placeholder="提示:笑"
                />
                】着说：“那你跟我一起去吧，我给你当导游。”可是李友想到还要去办签证，突然有点【
                <input
                  type="text"
                  value={clozeValues.v6}
                  onChange={(e) => setClozeValues({ ...clozeValues, v6: e.target.value })}
                  className="w-20 px-2 py-0.5 border border-indigo-300 rounded text-center text-indigo-700 font-bold focus:outline-none"
                  placeholder="提示:紧张"
                />
                】，她打算尽快去办。王朋【
                <input
                  type="text"
                  value={clozeValues.v7}
                  onChange={(e) => setClozeValues({ ...clozeValues, v7: e.target.value })}
                  className="w-20 px-2 py-0.5 border border-indigo-300 rounded text-center text-indigo-700 font-bold focus:outline-none"
                  placeholder="提示:高兴"
                />
                】地马上给旅行社打电话订机票。
              </p>

              <div className="flex items-center space-x-4 pt-2">
                <button
                  onClick={handleClozeCheck}
                  className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs sm:text-sm shadow transition"
                >
                  提交检查 (Check Answers)
                </button>
                {clozeScore !== null && (
                  <span className="text-xs sm:text-sm font-bold text-emerald-600">
                    得分：{clozeScore} / 7！
                  </span>
                )}
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-6">
            <div>
              <span className="px-3 py-1 bg-amber-100 text-amber-800 rounded-full text-xs font-bold">
                作文大工坊
              </span>
              <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mt-2">
                练习二：以“我的旅行计划”为题完成200字短文
              </h2>
              <p className="text-xs sm:text-sm text-slate-500 mt-1">
                回答5个核心要素，自动生成系统化作文并提供语法自查清单。
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">1. 去哪儿？看什么？和谁去？</label>
                  <input
                    type="text"
                    value={essay.destination}
                    onChange={(e) => setEssay({ ...essay, destination: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">2. 怎么去？选什么座位？</label>
                  <input
                    type="text"
                    value={essay.transport}
                    onChange={(e) => setEssay({ ...essay, transport: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">3. 住哪里？有什么服务？</label>
                  <input
                    type="text"
                    value={essay.accommodation}
                    onChange={(e) => setEssay({ ...essay, accommodation: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">4. 怎么玩？跟团还是自助？</label>
                  <input
                    type="text"
                    value={essay.activities}
                    onChange={(e) => setEssay({ ...essay, activities: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-600 mb-1">5. 期待是什么？</label>
                  <input
                    type="text"
                    value={essay.expectation}
                    onChange={(e) => setEssay({ ...essay, expectation: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                  />
                </div>
              </div>

              <div className="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex flex-col justify-between space-y-4">
                <div>
                  <h4 className="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
                    <span>📄 自动生成作文示例 (Generated Essay)</span>
                    <span className="text-xs text-indigo-600">约200字</span>
                  </h4>
                  <p className="text-sm leading-relaxed text-slate-700 whitespace-pre-line bg-white p-4 rounded-xl border border-slate-100 shadow-sm">
                    暑假快要到了，我打算和朋友一起去{essay.destination}旅行。因为听说那里的风景美丽得不得了。为了节省时间，我们决定{essay.transport}去，而且我喜欢坐在{essay.seat}看风景。到了目的地以后，我们打算住在当地的{essay.accommodation}，虽然没有大酒店方便，但“不方便就不方便吧，能体验当地生活就行”。这次旅行我们选择{essay.activities}。幸亏我们提前订好了房间和车票。希望这次旅行能让我们{essay.expectation}！
                  </p>
                </div>

                <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-xl space-y-2">
                  <div className="text-xs font-bold text-emerald-900">✅ 语法自查清单 (Grammar Checklist)</div>
                  <ul className="text-xs text-emerald-800 space-y-1">
                    <li>• 是否使用了 <code>想……就……</code> 或 <code>疑问词+就+疑问词</code>？</li>
                    <li>• 是否包含了 <code>A就A吧</code> 或 <code>不得不</code> 表达妥协/无奈？</li>
                    <li>• 是否使用了 <code>幸亏……(不然)</code> 表达幸运？</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
